pageInfo:
  title: Desk Hub
  description: Personal Focus & Dashboard
  navLinks: []

appConfig:
  theme: nightfall          # Sleek dark theme
  layout: auto
  iconSize: medium

sections:
  - name: Overview & Focus
    displayData:
      sortBy: default
      rows: 1
      cols: 2
    widgets:
      # 1. Live Weather Widget (Open-Meteo)
      - type: weather-forecast
        options:
          city: Chittagong
          units: metric
          updateInterval: 900
      
      # 2. Clock & Date
      - type: clock
        options:
          timeZone: Asia/Dhaka
          showSeconds: true
          format: 24h

      # 3. Daily Quotes
      - type: quote
        options:
          category: inspire
          updateInterval: 3600

  - name: Productivity & Tasks
    displayData:
      rows: 1
      cols: 2
    widgets:
      # 4. Google Calendar (Paste your Google iCal secret link below)
      - type: calendar
        options:
          icalUrl: "https://calendar.google.com/calendar/ical/nfprimo6%40gmail.com/private-5dec0a5857d17a8f9bf853b3817fc09d/basic.ics"
          view: agenda
          maxEvents: 5

  

  - name: Entertainment Watchlist
    widgets:
      # 6. Trakt.tv Up Next / TV Watchlist
      - type: trakt
        options:
          username: "zahi_ad785a"
          feed: "shows"
